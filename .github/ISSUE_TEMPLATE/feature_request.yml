name: Idea or feature request
description: Something the tool should do, or do differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation and what gets in the way - not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
