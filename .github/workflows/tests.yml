name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Parse check and smoke tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every script and the XAML
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Include *.ps1, *.psm1, *.psd1) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
              foreach ($e in $errors) {
                  Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  $bad++
              }
          }
          foreach ($f in Get-ChildItem -Recurse -Include *.xaml) {
              try { [void]([xml](Get-Content -LiteralPath $f.FullName -Raw)) }
              catch { Write-Host "::error file=$($f.FullName)::$($_.Exception.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }
          'All files parse.'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse the web page scripts
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem web/static/*.js) {
              node --check $f.FullName
              if ($LASTEXITCODE) { Write-Host "::error file=$($f.FullName)::does not parse"; exit 1 }
          }
          'All page scripts parse.'

      - name: Smoke tests (no tenant, no sign-in)
        shell: pwsh
        run: ./modules/DCU/tests/Run-SmokeTests.ps1
